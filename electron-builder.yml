appId: com.timekeeper.app
productName: Timekeeper
copyright: Copyright © 2026 Hauck Interactive, Inc.
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - "!**/*.map"
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.png
  hardenedRuntime: true
linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: build/icon.png
  maintainer: Rich Hauck
